name: Forklift Sales Machine PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend

  frontend-build:
    name: Admin frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install admin frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build admin frontend
        run: npm run build
        working-directory: frontend
        env:
          CI: false

  storefront-build:
    name: Storefront build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: materialsolutionsnj/package-lock.json

      - name: Install storefront dependencies
        run: npm ci
        working-directory: materialsolutionsnj

      - name: Build storefront
        run: npm run build
        working-directory: materialsolutionsnj
